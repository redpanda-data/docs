name: Run doc tests
on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      redpanda_version:
        description: 'Redpanda version to test, such as v26.2.1. Defaults to the latest stable GitHub release (stable vs beta channel decided by antora.yml).'
        required: false
        type: string
      redpanda_docker_repo:
        description: 'Redpanda Docker repo, such as redpanda or redpanda-unstable (for RCs). Defaults to redpanda (redpanda-unstable when antora.yml is in beta mode and an RC exists).'
        required: false
        type: string
      console_version:
        description: 'Redpanda Console version to test, such as v3.9.0. Defaults to the latest stable GitHub release (stable vs beta channel decided by antora.yml).'
        required: false
        type: string
      console_docker_repo:
        description: 'Console Docker repo, such as console. Defaults to console.'
        required: false
        type: string
  repository_dispatch:
    types: [trigger-tests]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      console: ${{ steps.filter.outputs.console }}
      quickstart: ${{ steps.filter.outputs.quickstart }}
      kindguide: ${{ steps.filter.outputs.kindguide }}
      versions: ${{ steps.filter.outputs.versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Determine changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            console:
              - 'modules/console/**'
            quickstart:
              - 'modules/get-started/pages/quick-start.adoc'
            kindguide:
              - 'modules/deploy/pages/redpanda/kubernetes/local-guide.adoc'
              - 'modules/deploy/partials/kubernetes/**'
              - 'antora.yml'
            # A version-bump PR signals a new Redpanda or Console release. The
            # quickstart test resolves the LATEST STABLE release at runtime
            # (not the antora.yml pins), so running it on bump PRs catches
            # breakage from that release before merge instead of in the
            # nightly run. antora.yml deliberately appears here and under
            # kindguide: dorny/paths-filter filters evaluate independently.
            versions:
              - 'antora.yml'

  run-tests:
    needs: setup
    # Skip the entire job for fork PRs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    strategy:
      matrix:
        os: [ubuntu-latest]  # Only using Linux for now since macOS doesn't include Docker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}
      - uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true
      - uses: actions/checkout@v4
        with:
          token: ${{ env.ACTIONS_BOT_TOKEN }}
          path: redpanda-docs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: redpanda-docs

      - name: Set GitHub token
        run: |
          echo "REDPANDA_GITHUB_TOKEN=${{ env.ACTIONS_BOT_TOKEN }}" >> $GITHUB_ENV

      - name: Run all tests
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event_name == 'schedule' }}
        uses: doc-detective/github-action@v1
        with:
          input: ../../modules/get-started/pages/quick-start.adoc
          working_directory: redpanda-docs/tests/setup-tests
          exit_on_fail: true
          # create a PR/issue only if the workflow wasn't already triggered by a PR
          create_pr_on_change: true
          create_issue_on_fail: true
          # Do not insert $RESULTS: full results can exceed GitHub's 65536-character issue
          # body limit. The doc-detective-output artifact has the JSON.
          issue_body: "A Doc Detective run ($RUN_URL) failed. Download the doc-detective-output artifact on the run for full results."
          token: ${{ env.ACTIONS_BOT_TOKEN }}
        # Optional version overrides. Manual runs set them through workflow
        # inputs. Upstream repos (for example Console releases or Redpanda RC
        # builds) set them through the trigger-tests dispatch payload. When
        # unset, the test resolves the latest stable GitHub release for each
        # product (doc-tools get-redpanda-version / get-console-version;
        # antora.yml only decides stable vs beta), not the antora.yml pins.
        #
        # Cross-repo contract for senders: repository_dispatch event type
        # `trigger-tests`, client_payload keys `redpanda_version`,
        # `redpanda_docker_repo`, `console_version`, `console_docker_repo`.
        #
        # The env var names are consumed by
        # tests/setup-tests/fetch-versions-and-rpk.json: renaming a variable
        # there silently disables its override here. These overrides attach
        # only to this all-tests step; a future dispatch that runs only the
        # quickstart step would need the same env block there.
        env:
          REDPANDA_VERSION: ${{ github.event.inputs.redpanda_version || github.event.client_payload.redpanda_version }}
          REDPANDA_DOCKER_REPO: ${{ github.event.inputs.redpanda_docker_repo || github.event.client_payload.redpanda_docker_repo }}
          REDPANDA_CONSOLE_VERSION: ${{ github.event.inputs.console_version || github.event.client_payload.console_version }}
          CONSOLE_DOCKER_REPO: ${{ github.event.inputs.console_docker_repo || github.event.client_payload.console_docker_repo }}

      - name: Test Redpanda Streaming quickstart
        if: ${{ needs.setup.outputs.quickstart == 'true' || needs.setup.outputs.console == 'true' || needs.setup.outputs.versions == 'true' }}
        uses: doc-detective/github-action@v1
        with:
          input: ../../modules/get-started/pages/quick-start.adoc
          working_directory: redpanda-docs/tests/setup-tests
          exit_on_fail: true
        env:
          REDPANDA_GITHUB_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doc-detective-output
          path: /home/runner/work/_temp/doc-detective-output.json
        env:
          REDPANDA_GITHUB_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}

  test-kind-guide:
    needs: setup
    # Skip the entire job for fork PRs. Run for all scheduled and manual triggers, and on PRs that touch the Kind guide or its shared partials.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || needs.setup.outputs.kindguide == 'true')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}
      - uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true
      - uses: actions/checkout@v4
        with:
          token: ${{ env.ACTIONS_BOT_TOKEN }}
          path: redpanda-docs

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: redpanda-docs

      - name: Set GitHub token
        run: |
          echo "REDPANDA_GITHUB_TOKEN=${{ env.ACTIONS_BOT_TOKEN }}" >> $GITHUB_ENV

      - name: Test Kind local development guide
        uses: doc-detective/github-action@v1
        with:
          input: ../../modules/deploy/pages/redpanda/kubernetes/local-guide.adoc
          working_directory: redpanda-docs/tests/setup-tests
          exit_on_fail: true
          # PR failures already surface as the failed check. Issues are for unattended runs.
          create_issue_on_fail: ${{ github.event_name != 'pull_request' }}
          issue_title: "Doc Detective failure: Kind local guide"
          issue_labels: "doc-detective,kind-guide"
          # Do not insert $RESULTS: full results exceed GitHub's 65536-character issue body
          # limit for this test. The doc-detective-kind-guide-output artifact has the JSON.
          issue_body: "A Doc Detective run ($RUN_URL) failed for the Kind local development guide. Download the doc-detective-kind-guide-output artifact on the run for full results. $PROMPT"
          integrations: "claude"
          prompt: "Investigate this Kind local development guide test failure. The test executes the commands documented in modules/deploy/pages/redpanda/kubernetes/local-guide.adoc and its shared partials (modules/deploy/partials/kubernetes/). Determine whether the failure is a docs bug (command drift vs the current operator/chart behavior), a product regression, or test environment flake, and propose the specific docs fix if applicable."
          token: ${{ env.ACTIONS_BOT_TOKEN }}
        env:
          REDPANDA_GITHUB_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}

      - name: Upload debug artifacts
        # always() so results survive job cancellation, such as a timeout-minutes kill.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-detective-kind-guide-output
          path: /home/runner/work/_temp/doc-detective-output.json
