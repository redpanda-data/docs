# Canonical registry of Redpanda enterprise features.
#
# This file is the single source of truth for WHICH features are enterprise and
# under WHAT external name they are documented. The enterprise: inline macro
# validates its targets against this registry, and the enterprise_features::
# block macro renders the licensing feature tables from it.
#
# Field reference:
#   name          Canonical external (customer-facing) name. Unique, case-insensitive.
#   scope         redpanda | console | connect | operator | cloud
#   xref          Antora resource ID of the feature page (omit if none exists).
#   url           Absolute link used instead of xref when the target is not an Antora page.
#   description   AsciiDoc for the table's Description column.
#   expiration    AsciiDoc for the "Behavior Upon Expiration" (redpanda scope) or
#                 "Restrictions Without Valid License" column.
#   aliases       Accepted alternative spellings, including internal identifiers.
#                 Resolved to the canonical name. Old names stay here permanently.
#   tooltip       Optional tooltip override for the enterprise: macro.
#   since         Optional first Redpanda version with the feature.
#   show-gating-property  Render the gating property under the feature name in tables.
#   feature-suffix  Extra AsciiDoc rendered after the feature name in tables
#                 (for example, a resource-name annotation or a beta badge).
#   source        Internal ground-truth pointer. kind: core-enum (a
#                 license_required_feature enum value in
#                 src/v/features/enterprise_features.h), core-property (a
#                 config::enterprise<> property in src/v/config/configuration.h),
#                 connect-plugin (a plugin in connect internal/plugins/info.csv), or
#                 manual (value holds the justification).
#   gating-property  Cluster/node property that enables the feature; cross-checked
#                 against disable-enterprise-features.adoc.
#   glossary-term Optional term-name of a related glossary entry in this component.
#   notes         Rationale when the internal-to-external mapping is not obvious.
#
# Governance: to mark a feature as enterprise in the docs, it MUST have an entry
# here. Adding an entry requires a source pointer and review by the CODEOWNERS.
# Multiple entries may share one source gate (for example, everything gated by
# cloud_storage). New license_required_feature enum values in core are flagged by
# `doc-tools validate enterprise-features` until an entry exists.
schema-version: 1
features:
  # ---------------------------------------------------------------- redpanda
  - name: Audit Logging
    scope: redpanda
    xref: manage:audit-logging.adoc
    description: |
      Records detailed logs of cluster activities for compliance and monitoring.
    expiration: |
      Read access to the audit log topic is denied, but logging continues.
    aliases: [audit_logging]
    source:
      kind: core-enum
      value: audit_logging
    gating-property: audit_enabled

  - name: Cloud Topics
    scope: redpanda
    xref: develop:manage-topics/cloud-topics.adoc
    description: |
      A Redpanda topic type that uses durable object storage as the primary backing store instead of local disk replication.
    expiration: |
      New Cloud Topics cannot be created. Existing Cloud Topics cannot be modified, including adding or modifying partitions. Major upgrades are blocked when in a violation state.
    source:
      kind: manual
      value: License-enforced at Cloud Topics creation and modification; no dedicated license_required_feature enum value as of 26.2.
    notes: Revisit when core adds a cloud_topics enum value.

  - name: Continuous Data Balancing
    scope: redpanda
    xref: manage:cluster-maintenance/continuous-data-balancing.adoc
    description: |
      Automatically balances partitions across a cluster to optimize resource use and performance.

      Continuous Data Balancing is enabled by default for all new clusters with valid licenses.
    expiration: |
      Continuous balancing is disabled, reverting to `node_add` setting that balances partitions only after a broker is added to the cluster.
    aliases: [CDB, partition_auto_balancing_continuous]
    source:
      kind: core-enum
      value: partition_auto_balancing_continuous
    gating-property: partition_autobalancing_mode

  - name: Continuous Intra-Broker Partition Balancing
    scope: redpanda
    xref: manage:cluster-maintenance/cluster-balancing.adoc#intra-broker-partition-balancing
    description: |
      Balances partition replicas across CPU cores in an individual broker to optimize disk space usage.

      Continuous Intra-Broker Partition Balancing is enabled by default for all new clusters with a valid license.
    expiration: |
      Continuous Intra-Broker Partition Balancing is disabled.
    aliases: [core_balancing_continuous]
    show-gating-property: true
    source:
      kind: core-enum
      value: core_balancing_continuous
    gating-property: core_balancing_continuous

  - name: Fetch Read Coalescing
    scope: redpanda
    xref: manage:cluster-maintenance/fetch-read-coalescing.adoc
    description: |
      Shares one read result across concurrent fetches of the same data, reducing read CPU and fetch-response memory under high consumer fan-out.
    expiration: |
      It will switch off automatically, similar to the other balancing features.
    source:
      kind: manual
      value: Gated by an enterprise-wrapped cluster property; no dedicated license_required_feature enum value as of 26.2.
    notes: Confirm the exact config::enterprise<> property when the drift checker gains property-level resolution.

  - name: FIPS Compliance
    scope: redpanda
    xref: manage:security/fips-compliance.adoc
    description: |
      Enables compliance with FIPS security standards for cryptography.
    expiration: |
      No change.
    aliases: [fips]
    source:
      kind: core-enum
      value: fips
    gating-property: fips_mode

  - name: Group-Based Access Control (GBAC)
    scope: redpanda
    xref: manage:security/authorization/gbac.adoc
    description: |
      Manages permissions using OIDC group memberships for ACLs and role assignments.
    expiration: |
      ACLs with `Group:` principals cannot be created. Existing group ACLs continue to be evaluated and can be deleted.
    aliases: [GBAC, Group-Based Access Control]
    source:
      kind: core-enum
      value: rbac
    notes: Shares the rbac license gate in core (see acl_with_group in enterprise_feature_messages.h). Documented as a separate feature because customers configure it independently of roles.

  - name: Iceberg Topics
    scope: redpanda
    xref: manage:iceberg/topic-iceberg-integration.adoc
    description: |
      Enables Iceberg integration for Redpanda topics.
    expiration: |
      Topics cannot be created or modified with the `redpanda.iceberg.mode` property.
    aliases: [datalake_iceberg]
    source:
      kind: core-enum
      value: datalake_iceberg
    gating-property: iceberg_enabled

  - name: Kerberos Authentication
    scope: redpanda
    xref: manage:security/authentication.adoc#kerberos
    description: |
      Provides secure Kerberos-based authentication.
    expiration: |
      No change.
    aliases: [gssapi, Kerberos]
    source:
      kind: core-enum
      value: gssapi
    gating-property: sasl_mechanisms
    notes: Triggered by GSSAPI in sasl_mechanisms.

  - name: Leader Pinning
    scope: redpanda
    xref: develop:produce-data/leader-pinning.adoc
    description: |
      Specifies the set of availability zones where the leaders of partitions of a given topic should be located.
    expiration: |
      Leader Pinning is disabled on all topics.
    aliases: [leadership_pinning, Leadership Pinning]
    source:
      kind: core-enum
      value: leadership_pinning
    gating-property: default_leaders_preference

  - name: OAUTHBEARER/OIDC Authentication
    scope: redpanda
    xref: manage:security/authentication.adoc#oidc
    description: |
      Allows for OAUTHBEARER and OpenID Connect (OIDC) authentication.
    expiration: |
      No change.
    aliases: [oidc, OIDC Authentication]
    source:
      kind: core-enum
      value: oidc
    gating-property: http_authentication
    notes: Also triggered by OAUTHBEARER in sasl_mechanisms.

  - name: Remote Read Replicas
    scope: redpanda
    xref: manage:remote-read-replicas.adoc
    description: |
      Enables remote clusters to read data stored in object storage for disaster recovery.
    expiration: |
      Remote Read Replica topics cannot be created or modified.
    aliases: [RRR]
    source:
      kind: core-enum
      value: cloud_storage
    notes: Enforced under the cloud_storage license gate together with Tiered Storage, Topic Recovery, and Whole Cluster Restore.
    glossary-term: Remote Read Replica

  - name: Role-Based Access Control (RBAC)
    scope: redpanda
    xref: manage:security/authorization/rbac.adoc
    description: |
      Manages user roles and permissions within the cluster.
    expiration: |
      Roles and ACLs associated with roles cannot be created or modified. Role deletion is allowed.
    aliases: [rbac, Role-Based Access Control]
    source:
      kind: core-enum
      value: rbac

  - name: Schema Registry Authorization
    scope: redpanda
    xref: manage:schema-reg/schema-reg-authorization.adoc
    description: |
      Manages ACLs for Redpanda Schema Registry resources within the cluster.
    expiration: |
      You can no longer enable `schema_registry_enable_authorization`, nor can you create or modify schema ACLs.
    source:
      kind: core-property
      value: schema_registry_enable_authorization
    gating-property: schema_registry_enable_authorization
    notes: Enterprise-wrapped property with no license_required_feature enum value.

  - name: Server-Side Schema ID Validation
    scope: redpanda
    xref: manage:schema-reg/schema-id-validation.adoc
    description: |
      Validates schema IDs server-side to ensure schema compatibility. With schema ID validation, records associated with unregistered schemas are detected and dropped by a broker rather than a consumer.
    expiration: |
      Topics with schema validation settings cannot be created or modified.
    aliases: [schema_id_validation, Schema ID Validation]
    source:
      kind: core-enum
      value: schema_id_validation
    gating-property: enable_schema_id_validation

  - name: Shadowing
    scope: redpanda
    xref: deploy:redpanda/manual/disaster-recovery/shadowing/index.adoc
    description: |
      Provides enterprise-grade disaster recovery through asynchronous, offset-preserving replication between distinct Redpanda clusters for cross-region data protection.
    expiration: |
      New shadow links cannot be created. Existing shadow links continue operating and can be updated.
    aliases: [shadow_linking, Shadow Linking]
    source:
      kind: core-enum
      value: shadow_linking
    gating-property: enable_shadow_linking

  - name: Topic Deletion Control
    scope: redpanda
    description: |
      When set to `false`, prevents all users, including superusers, from deleting topics through the Kafka DeleteTopics API. This property provides a cluster-wide safety guard against accidental topic deletion.
    expiration: |
      Topic deletion reverts to enabled (`true`).
    aliases: [topic_deletion_disabled]
    show-gating-property: true
    source:
      kind: core-enum
      value: topic_deletion_disabled
    gating-property: delete_topic_enable
    notes: No dedicated feature page; the table renders the name without a link.

  - name: Topic Recovery
    scope: redpanda
    xref: manage:topic-recovery.adoc
    description: |
      Allows restoring a single topic from Tiered Storage using remote recovery properties.
    expiration: |
      You cannot create topics with the `redpanda.remote.recovery=true` property or perform topic recovery operations. To proceed, add a valid license to the target cluster. Without a valid license, topic recovery is blocked.
    source:
      kind: core-enum
      value: cloud_storage
    notes: Enforced under the cloud_storage license gate together with Tiered Storage, Remote Read Replicas, and Whole Cluster Restore.

  - name: Tiered Storage
    scope: redpanda
    xref: manage:tiered-storage.adoc
    description: |
      Enables data storage in cloud object storage for long-term retention and retrieval.
    expiration: |
      Topics cannot be created or modified to enable Tiered Storage features. Additional partitions cannot be added to topics with Tiered Storage properties enabled.
    aliases: [cloud_storage]
    source:
      kind: core-enum
      value: cloud_storage
    gating-property: cloud_storage_enabled
    glossary-term: Tiered Storage

  - name: Whole Cluster Restore (WCR)
    scope: redpanda
    xref: manage:whole-cluster-restore.adoc
    description: |
      Enables the recovery of cluster data from a source cluster's snapshot.
    expiration: |
      If the license is expired, you cannot perform WCR. To proceed, add a valid license to the target cluster. If the source cluster has an expired license, the target cluster inherits the restriction until a valid license is applied.
    aliases: [WCR, Whole Cluster Restore]
    source:
      kind: core-enum
      value: cloud_storage
    notes: Enforced under the cloud_storage license gate together with Tiered Storage, Remote Read Replicas, and Topic Recovery.

  # ----------------------------------------------------------------- console
  - name: Authentication for Redpanda Console
    scope: console
    xref: console:config/security/authentication.adoc
    description: |
      Enables authentication for Redpanda Console, including secure login through OIDC and OAuth 2.0 SSO.
    expiration: |
      All pages are redirected to the license expiration landing page, and all other access is restricted.
    source:
      kind: manual
      value: Enforced by the Console license service; Console has no machine-readable enterprise feature list.

  - name: Authorization (RBAC) for Redpanda Console
    scope: console
    xref: console:config/security/authorization.adoc
    description: |
      Manages user roles and permissions for accessing features within Redpanda and Redpanda Console.
    expiration: |
      All pages are redirected to the license expiration landing page, and all other access is restricted.
    aliases: [Authorization (RBAC) for Redpanda]
    source:
      kind: manual
      value: Enforced by the Console license service; Console has no machine-readable enterprise feature list.

  - name: Debug bundle generation
    scope: console
    xref: console:ui/generate-bundle.adoc
    description: |
      Enables generating and downloading debug bundles in Redpanda Console for comprehensive cluster diagnostics.
    expiration: |
      All pages are redirected to the license expiration landing page, and all other access is restricted.
    source:
      kind: manual
      value: Enforced by the Console license service; Console has no machine-readable enterprise feature list.

  - name: Reassign Partitions
    scope: console
    description: |
      Enables the ability to move partitions between brokers.
    expiration: |
      All pages are redirected to the license expiration landing page, and all other access is restricted.
    source:
      kind: manual
      value: Enforced by the Console license service; Console has no machine-readable enterprise feature list.
    notes: No dedicated feature page; the table renders the name without a link.

  # ----------------------------------------------------------------- connect
  - name: Allow or deny lists
    scope: connect
    xref: connect:configuration:allow_and_deny_lists.adoc
    description: |
      Limit the Redpanda Connect components that users can run within data pipelines on a Redpanda Connect instance.
    expiration: |
      No change.
    source:
      kind: manual
      value: Enforced by CheckRunningEnterprise call sites in connect; no central Go-level feature list.

  - name: Enterprise connectors
    scope: connect
    url: https://docs.redpanda.com/redpanda-connect/components/catalog/?support=enterprise
    description: |
      Additional inputs, outputs, and processors available only to enterprise customers.
    expiration: |
      All enterprise connectors are blocked.
    source:
      kind: manual
      value: Aggregate entry; individual connectors are tracked by the support column in connect internal/plugins/info.csv.

  - name: FIPS compliance for Redpanda Connect
    scope: connect
    xref: connect:get-started:quickstarts/rpk.adoc#fips-compliance
    description: |
      Run Redpanda Connect using a FIPS-compliant version of `rpk`, the Redpanda command-line interface (CLI).
    expiration: |
      No change.
    source:
      kind: manual
      value: Enforced through the FIPS-compliant rpk distribution.
    notes: Renamed from the ambiguous "FIPS compliance" to avoid colliding with the Redpanda-scope FIPS Compliance entry.

  - name: Redpanda Connect configuration service
    scope: connect
    xref: connect:components:redpanda/about.adoc
    description: |
      A configuration block that you can use to send logs and status events to a topic on a Redpanda cluster.
    expiration: |
      No change.
    source:
      kind: manual
      value: Enforced by CheckRunningEnterprise call sites in connect; no central Go-level feature list.

  - name: Secrets management
    scope: connect
    xref: connect:configuration:secrets.adoc#look-up-secrets-on-a-remote-system-at-runtime
    description: |
      Retrieve secrets values from a remote system, such as a secret management solution, without setting environment variables.
    expiration: |
      No change.
    source:
      kind: manual
      value: Enforced by CheckRunningEnterprise call sites in connect; no central Go-level feature list.

  # ---------------------------------------------------------------- operator
  - name: Stretch Clusters
    scope: operator
    xref: deploy:redpanda/kubernetes/k-stretch-clusters.adoc
    description: |
      A single logical Redpanda cluster distributed across multiple Kubernetes clusters for multi-region high availability, managed by the multicluster Redpanda Operator.
    expiration: |
      The multicluster operator requires a valid license to start, so stretch clusters cannot be deployed or managed without one. On a running stretch cluster, the operator continuously reports license state through the StretchCluster resource's `LicenseValid` status condition and `status.licenseStatus`, including the expiration date and any enterprise features in violation. When the license expires, the stretch cluster keeps running and its brokers' enterprise features follow the restrictions in <<redpanda-enterprise-features, table 1>>.
    aliases: [StretchCluster]
    source:
      kind: manual
      value: License gate in operator cmd/multicluster (ReadLicense; "Operator requires enterprise license").
    notes: Feature name suffix "(StretchCluster resource)" is rendered from feature-suffix.
    feature-suffix: (StretchCluster resource)

  - name: Redpanda Connect pipelines
    scope: operator
    xref: manage:kubernetes/k-connect-pipelines.adoc
    description: |
      Run Redpanda Connect pipelines declaratively through the operator's Connect controller. Requires a license that includes the Redpanda Connect product.
    expiration: |
      When the license is missing, expired, invalid, or does not include the Redpanda Connect product, the operator stops creating and updating pipeline workloads: new Pipeline resources report `License: False` in their status and are never deployed, and existing pipelines keep running with their last-applied configuration but no longer receive updates. Applying a valid license resumes reconciliation automatically, without recreating any Pipeline resources.
    aliases: [Pipeline resource]
    source:
      kind: manual
      value: License gate in operator internal/controller/pipeline (license does not allow enterprise features).
    notes: Beta badge and "(Pipeline resource)" suffix are rendered from feature-suffix.
    feature-suffix: (Pipeline resource) badge::[label=beta]
